<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AI 의료 결정 토론 보드</title>
<meta name="claude:viewport-fit-sides" content="cover">
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
<script src="firebase-config.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: 한 화면 앱. 상단 띠(논제 + 보기 전환) → 본문은 [브레인스토밍 보드] / [나란히] / [최종 정리 창]. 보드는 무한 캔버스 위 카드와 연결선. */
:root{
  --bg:#f2f4f7; --surface:#ffffff; --sunk:#e6eaf0; --grid:#dde2ea; --line:#c9d1dd; --fg:#17202b; --muted:#5a6575;
  --pro:#1f4fb8; --pro-soft:#e2eafb; --con:#b0234a; --con-soft:#f8e1e7;
  --src:#2f6b4f; --src-soft:#e1f0e8; --memo:#7a5a00; --memo-soft:#fbf2d4;
  --warn:#9a6400; --warn-soft:#fbefd2; --ok:#1d7a4c;
  --display:"Black Han Sans","IBM Plex Sans KR",system-ui,sans-serif;
  --body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f131a; --surface:#171d27; --sunk:#0b0e14; --grid:#1d2430; --line:#2d3747; --fg:#e7ebf1; --muted:#98a3b4;
  --pro:#86a9ff; --pro-soft:#1a2746; --con:#ff86a3; --con-soft:#3a1825;
  --src:#6fd0a2; --src-soft:#14302a; --memo:#f0c766; --memo-soft:#33290f;
  --warn:#f0bf5a; --warn-soft:#352914; --ok:#5fd39a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f131a; --surface:#171d27; --sunk:#0b0e14; --grid:#1d2430; --line:#2d3747; --fg:#e7ebf1; --muted:#98a3b4;
  --pro:#86a9ff; --pro-soft:#1a2746; --con:#ff86a3; --con-soft:#3a1825;
  --src:#6fd0a2; --src-soft:#14302a; --memo:#f0c766; --memo-soft:#33290f;
  --warn:#f0bf5a; --warn-soft:#352914; --ok:#5fd39a; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html.noai #aiReb,html.noai [data-polish],html.noai #genCx{display:none!important}
body{margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:14px;line-height:1.5;overflow:hidden}
.app{height:100%;display:flex;flex-direction:column}
header.top{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;justify-content:space-between;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:2px solid var(--fg);background:var(--surface)}
.ttl{min-width:0;flex:1 1 360px}
.eyebrow{font-size:11px;letter-spacing:.08em;color:var(--muted);font-weight:600}
h1{font-family:var(--display);font-weight:400;font-size:clamp(17px,2.2vw,23px);line-height:1.25;margin:2px 0 0;text-wrap:balance}
.seg{display:inline-flex;background:var(--sunk);border-radius:9px;padding:3px;gap:2px}
.seg button{font:inherit;font-size:13px;font-weight:600;border:0;background:transparent;color:var(--muted);padding:6px 11px;border-radius:7px;cursor:pointer;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgb(0 0 0 / .14)}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--pro);outline-offset:2px}
.btn{font:inherit;font-size:13px;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:6px 11px;border-radius:8px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--fg)}
.btn.primary{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.btn.pro{color:var(--pro)}.btn.con{color:var(--con)}.btn.src{color:var(--src)}.btn.memo{color:var(--memo)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.danger{color:var(--con)}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.muted{color:var(--muted)}.small{font-size:12.5px}
.status{font-size:12.5px;min-height:1.2em}.status.err{color:var(--con)}
.pill{font-size:11px;font-weight:600;padding:1px 7px;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.pill.ok{color:var(--ok)}
#syncState.live{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
#syncState.off{background:var(--warn-soft);color:var(--warn)}.pill.need{background:var(--warn-soft);color:var(--warn)}.pill.new{background:var(--fg);color:var(--bg)}
.tag{display:inline-flex;padding:2px 8px;border-radius:999px;font-size:11.5px;font-weight:700}
.tag.pro{background:var(--pro-soft);color:var(--pro)}.tag.con{background:var(--con-soft);color:var(--con)}.tag.src{background:var(--src-soft);color:var(--src)}

main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr);--sp:56}
main.split{grid-template-columns:minmax(0,calc(var(--sp) * 1%)) 12px minmax(0,1fr)}
#splitter{background:var(--sunk);cursor:col-resize;position:relative;touch-action:none;border-inline:1px solid var(--line)}
#splitter::after{content:"";position:absolute;left:50%;top:50%;width:4px;height:48px;margin:-24px 0 0 -2px;border-radius:2px;background:var(--muted)}
#splitter:hover::after,#splitter.drag::after,#splitter:focus-visible::after{background:var(--fg)}
@media (max-width:860px){
  main.split{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,calc(var(--sp) * 1%)) 12px minmax(0,1fr)}
  #splitter{cursor:row-resize;border-inline:0;border-block:1px solid var(--line)}
  #splitter::after{width:48px;height:4px;margin:-2px 0 0 -24px}
}
#lanes{position:absolute;left:0;top:0}
.lanebox{position:absolute;border:2px dashed;border-radius:20px;pointer-events:none}
.lanebox.pro{border-color:color-mix(in srgb,var(--pro) 45%,transparent);background:color-mix(in srgb,var(--pro) 6%,transparent)}
.lanebox.con{border-color:color-mix(in srgb,var(--con) 45%,transparent);background:color-mix(in srgb,var(--con) 6%,transparent)}
.lanebox .lh{position:absolute;left:20px;top:12px;display:flex;gap:10px;align-items:baseline;white-space:nowrap}
.lanebox .lh b{font-family:var(--display);font-weight:400;font-size:22px}
.lanebox.pro .lh b{color:var(--pro)}.lanebox.con .lh b{color:var(--con)}
.lanebox .lh span{font-size:13px;color:var(--muted);font-weight:600}
.lt{display:inline-block;font-size:10.5px;font-weight:700;padding:0 6px;border-radius:5px;margin-right:4px}
.lt.pro{background:var(--pro-soft);color:var(--pro)}.lt.con{background:var(--con-soft);color:var(--con)}
.nd.issue{cursor:default}
.lock{font-size:10.5px;font-weight:700;opacity:.7;margin-left:6px}
.btn[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}

/* ---------- 보드 ---------- */
#boardWrap{position:relative;min-height:0;min-width:0;overflow:hidden}
#board{position:absolute;inset:0;overflow:hidden;touch-action:none;cursor:grab;background-color:var(--bg);background-image:radial-gradient(var(--grid) 1.2px,transparent 1.3px);background-size:24px 24px}
#board.panning{cursor:grabbing}
#world{position:absolute;left:0;top:0;transform-origin:0 0}
#edges{position:absolute;left:0;top:0;width:1px;height:1px;overflow:visible}
#edges path.e{fill:none;stroke-width:2}
#edges path.hit{fill:none;stroke:transparent;stroke-width:14;cursor:pointer}
#edges .lbl{font:600 11px var(--body);paint-order:stroke;stroke:var(--bg);stroke-width:4px;stroke-linejoin:round}
.nd{position:absolute;width:236px;background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:8px 11px 9px;cursor:pointer;user-select:none;-webkit-user-select:none;display:flex;flex-direction:column;gap:3px;box-shadow:0 1px 2px rgb(0 0 0 / .06)}
.nd.claim{border-left-width:5px}
.nd.pro{border-left-color:var(--pro)}.nd.con{border-left-color:var(--con)}
.nd.src{background:var(--src-soft);border-color:color-mix(in srgb,var(--src) 35%,transparent);width:220px}
.nd.memo{background:var(--memo-soft);border-style:dashed;border-color:color-mix(in srgb,var(--memo) 45%,transparent);width:200px}
.nd.issue{width:170px;background:var(--fg);color:var(--bg);border-color:var(--fg);padding:12px 14px}
.nd.issue .nd-t{font-family:var(--display);font-weight:400;font-size:20px}
.nd.issue .nd-r{color:color-mix(in srgb,var(--bg) 75%,transparent)}
.nd.sel{box-shadow:0 0 0 3px color-mix(in srgb,var(--fg) 30%,transparent);border-color:var(--fg)}
.nd.flash{animation:flash 1.2s ease-out}
@keyframes flash{0%{box-shadow:0 0 0 8px color-mix(in srgb,var(--warn) 55%,transparent)}100%{box-shadow:0 0 0 0 transparent}}
.nd.drop{box-shadow:0 0 0 3px var(--ok)}
.nd-kind{font-size:10.5px;font-weight:700;letter-spacing:.04em;color:var(--muted)}
.nd.pro .nd-kind{color:var(--pro)}.nd.con .nd-kind{color:var(--con)}.nd.src .nd-kind{color:var(--src)}.nd.memo .nd-kind{color:var(--memo)}
.nd-t{font-weight:600;font-size:13.5px;line-height:1.4}
.nd-r{font-size:12px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.nd-meta{display:flex;gap:4px;flex-wrap:wrap;margin-top:2px}
.port{position:absolute;right:-9px;top:50%;width:18px;height:18px;margin-top:-9px;border-radius:50%;background:var(--surface);border:2px solid var(--muted);cursor:crosshair;display:grid;place-items:center;font-size:12px;line-height:1;color:var(--muted);font-weight:700}
.port:hover{border-color:var(--fg);color:var(--fg)}
.nd.issue .port{display:none}
.chainline{display:flex;flex-direction:column;gap:2px;border-top:1px dashed var(--line);padding-top:5px;margin-top:3px}

.hud{position:absolute;display:flex;gap:6px;flex-wrap:wrap;align-items:center;z-index:5}
.hud.tl{left:max(12px,env(safe-area-inset-left,0px));top:12px;right:12px;pointer-events:none}
.hud.tl > *{pointer-events:auto}
.hud.bl{left:max(12px,env(safe-area-inset-left,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px))}
.hud .grp{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:4px;box-shadow:0 2px 8px rgb(0 0 0 / .08);flex-wrap:wrap}
.hud .grp .btn{border-color:transparent}
.zoomv{font-family:var(--mono);font-size:12px;min-width:44px;text-align:center;font-variant-numeric:tabular-nums;color:var(--muted);align-self:center}
.hint{font-size:12px;color:var(--muted);background:color-mix(in srgb,var(--surface) 88%,transparent);padding:4px 9px;border-radius:7px}

.drawer{position:absolute;top:0;bottom:0;width:min(360px,100%);background:var(--surface);border:1px solid var(--line);z-index:8;overflow-y:auto;padding:14px 16px calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px;box-shadow:0 6px 24px rgb(0 0 0 / .14)}
#panel{right:0;border-right:0}
#lib{left:0;border-left:0}
@media (max-width:640px){
  .drawer{top:auto;width:100%;max-height:62%;border-radius:14px 14px 0 0;border-left:1px solid var(--line);border-right:1px solid var(--line)}
}
.drawer h3{margin:0;font-size:15px}
.drawer .head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.field{display:flex;flex-direction:column;gap:3px}
.field label,.flabel{font-size:11.5px;font-weight:700;color:var(--muted);letter-spacing:.03em}
input[type=text],input[type=url],textarea,select{font:inherit;font-size:13.5px;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 9px;width:100%}
textarea{resize:vertical;min-height:58px}
.conn{display:flex;flex-direction:column;gap:4px}
.conn div{display:flex;gap:6px;align-items:center;justify-content:space-between;font-size:12.5px;background:var(--bg);border-radius:7px;padding:4px 4px 4px 8px}
.conn span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.libitem{border:1px solid var(--line);border-radius:10px;padding:10px 11px;display:flex;flex-direction:column;gap:5px;background:var(--bg)}
.libitem b{font-size:13.5px}
.libitem p{margin:0;font-size:12.5px;color:var(--muted)}
.libitem a{font-size:12px;color:var(--src);word-break:break-all}
hr.sep{border:0;border-top:1px solid var(--line);margin:4px 0;width:100%}

/* ---------- 최종 정리 창 ---------- */
#sumWrap{min-height:0;min-width:0;overflow-y:auto;touch-action:pan-x pan-y;background:var(--sunk);border-left:2px solid var(--fg)}
@media (max-width:860px){#sumWrap{border-left:0;border-top:2px solid var(--fg)}}
main:not(.split) #sumWrap{border:0}
.sheet{max-width:880px;margin:0 auto;padding-block:18px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
.sheet-top{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:center}
.sheet-top h2{margin:0;font-family:var(--display);font-weight:400;font-size:22px}
.sec{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;min-width:0}
.sec h3{margin:0 0 10px;font-size:15.5px;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.sec h3 .no{font-family:var(--mono);font-size:12px;color:var(--muted)}
.sec h3 small{font-weight:500;color:var(--muted);font-size:12px}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px;min-width:520px}
th,td{border:1px solid var(--line);padding:7px 9px;text-align:left;vertical-align:top}
th{background:var(--bg);font-weight:700;font-size:12.5px}
td.c{text-align:center;font-weight:700;background:var(--bg);white-space:nowrap}
th.pro{color:var(--pro)}th.con{color:var(--con)}
td ul{margin:0;padding-left:16px}
.jump{border:0;background:none;padding:0;font:inherit;color:inherit;text-align:left;cursor:pointer;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.jump:hover{text-decoration-color:var(--fg)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:640px){.grid2{grid-template-columns:minmax(0,1fr)}}
main.split .grid2{grid-template-columns:minmax(0,1fr)}
.argcard{border:1px solid var(--line);border-left:4px solid var(--line);border-radius:8px;padding:8px 10px;display:flex;flex-direction:column;gap:3px;font-size:13px;background:var(--bg)}
.argcard.pro{border-left-color:var(--pro)}.argcard.con{border-left-color:var(--con)}
.argcard .k{font-size:11px;font-weight:700;color:var(--muted)}
.speech textarea{min-height:240px;line-height:1.7;font-size:14px}
.meter{font-family:var(--mono);font-size:12px;font-variant-numeric:tabular-nums;color:var(--muted)}
.meter.over{color:var(--con)}
.order{display:flex;flex-wrap:wrap;gap:4px;font-size:11.5px}
.order span{padding:2px 7px;border-radius:5px;background:var(--bg)}
.order .p{color:var(--pro)}.order .c{color:var(--con)}
.qitem{border:1px solid var(--line);border-radius:9px;padding:9px 11px;display:flex;flex-direction:column;gap:5px;background:var(--bg)}
.qitem .lbl{font-size:11px;font-weight:700;letter-spacing:.03em;color:var(--muted)}
.qitem p{margin:0;font-size:13.5px}
.tips{font-size:12.5px;color:var(--muted);margin:0;padding-left:18px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:9px;font-size:13px;z-index:20;display:flex;gap:10px;align-items:center;max-width:calc(100% - 32px)}
.toast button{font:inherit;font-weight:700;border:0;background:transparent;color:var(--bg);text-decoration:underline;cursor:pointer}
@media (prefers-reduced-motion:reduce){.nd.flash{animation:none}}
</style>

</head>
<body>
<div class="app">
  <header class="top">
    <div class="ttl">
      <div class="eyebrow">CEDA 반대 신문식 토론 · 정책 논제 · 찬성·반대 모두 준비</div>
      <h1>AI가 의료진의 생명 관련 의사결정을 대신하는 것을 허용해야 한다</h1>
    </div>
    <div class="row" id="syncBar"><span class="pill" id="syncState">혼자 쓰는 중</span><span class="pill" id="roomName"></span><button class="btn ghost small" id="copyLink">모둠 링크 복사</button></div>
    <div class="seg" role="group" aria-label="화면 보기">
      <button aria-pressed="true" data-mode="board">브레인스토밍 보드</button>
      <button aria-pressed="false" data-mode="split">나란히 보기</button>
      <button aria-pressed="false" data-mode="sum">최종 정리 창</button>
    </div>
  </header>

  <main id="main">
    <section id="boardWrap" aria-label="브레인스토밍 보드">
      <div id="board">
        <div id="world">
          <div id="lanes" aria-hidden="true"></div>
          <svg id="edges" aria-hidden="true">
            <defs>
              <marker id="m-pro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" style="fill:var(--pro)"/></marker>
              <marker id="m-con" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" style="fill:var(--con)"/></marker>
              <marker id="m-sup" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" style="fill:var(--src)"/></marker>
              <marker id="m-link" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" style="fill:var(--muted)"/></marker>
            </defs>
            <g id="edgeLayer"></g>
            <path id="tempEdge" class="e" style="stroke:var(--fg);stroke-dasharray:5 4" d=""/>
          </svg>
          <div id="nodes"></div>
        </div>
      </div>
      <div class="hud tl">
        <div class="grp">
          <button class="btn src" id="openLib">자료함·자료 넣기</button>
        </div>
        <div class="grp" role="group" aria-label="카드 추가">
          <button class="btn pro" data-add="pro">+ 찬성</button>
          <button class="btn con" data-add="con">+ 반대</button>
          <button class="btn src" data-add="src">+ 근거</button>
          <button class="btn memo" data-add="memo">+ 메모</button>
        </div>
        <span class="hint" id="hint">두 손가락으로 벌리면 확대, 함께 끌면 이동해요. 카드는 끌어 옮기고 ● 점을 끌어 이으세요.</span>
      </div>
      <div class="hud bl">
        <div class="grp">
          <button class="btn" id="zOut" aria-label="축소">−</button>
          <span class="zoomv" id="zv">100%</span>
          <button class="btn" id="zIn" aria-label="확대">+</button>
          <button class="btn" id="zFit">전체 보기</button>
          <button class="btn" id="layoutBtn">자동 정렬</button>
          <button class="btn" id="saveFile">파일로 저장</button>
          <label class="btn" for="loadFile" style="cursor:pointer">파일 불러오기</label><input type="file" id="loadFile" accept=".json,application/json" hidden>
        </div>
      </div>
      <aside class="drawer" id="lib" hidden aria-label="자료함"></aside>
      <aside class="drawer" id="panel" hidden aria-label="카드 편집"></aside>
    </section>

    <div id="splitter" role="separator" aria-orientation="vertical" aria-label="창 크기 조절 (방향키로도 조절)" tabindex="0" hidden></div>

  });
  S.argset1 = true;
  return added;
}

function shared(st){
  const o = {meta:{topic:st.topic, terms:st.terms||[], background:st.background||[]}, nodes:{}, edges:{}, cx:st.cx||[], speeches:st.speeches||{}};
  st.nodes.forEach(n => o.nodes[n.id] = clean(n)); st.edges.forEach(e => o.edges[e.id] = clean(e));

function pushDiff(){
  if (!FB || !last) return;
  const cur = shared(S), upd = {}; const J = JSON.stringify;
  for (const col of ["nodes","edges"]){
    for (const id in cur[col]) if (J(cur[col][id]) !== J(last[col]?.[id])) upd[col+"/"+id] = cur[col][id];
    for (const id in (last[col]||{})) if (!cur[col][id]) upd[col+"/"+id] = null;
  }
  for (const k of ["cx","speeches"]) if (J(cur[k]) !== J(last[k])) upd[k] = (Array.isArray(cur[k]) ? cur[k].length : Object.keys(cur[k]).length) ? cur[k] : null;
  for (const k of ["topic","terms","background"]) if (J(cur.meta[k]) !== J(last.meta?.[k])) upd["meta/"+k] = cur.meta[k];
  last = cur;
  if (Object.keys(upd).length) FB.ref.update(upd).catch(() => toast("저장하지 못했습니다. 인터넷 연결을 확인해 주세요."));
}
function syncSoon(){ if (FB && !pushT) pushT = setTimeout(()=>{ pushT = null; pushDiff(); }, 150); }

const supports = id => S.edges.filter(e=>e.kind==="support" && e.to===id).map(e=>byId(e.from)).filter(n=>n && n.kind==="src");
function depth(n, seen=new Set()){ if (seen.has(n.id)) return 0; seen.add(n.id); const t = outRebut(n.id); return t.length ? 1 + depth(t[0], seen) : 0; }
const roleName = n => { const d = depth(n); return sideName(n.side) + " " + (d===0 ? "입론" : d===1 ? "반론" : d===2 ? "재반박" : "재반론"); };
function rootOf(n){ let cur = n, g = 0; while (cur && g++ < 12){ const t = outRebut(cur.id)[0]; if (!t) break; cur = t; } return cur || n; }
const CIRC = "①②③④⑤⑥⑦⑧⑨⑩⑪⑫";
let laneNo = {};
function computeLaneNo(){
  laneNo = {}; const cnt = {pro:0, con:0};
  const roots = S.nodes.filter(n => n.kind==="claim" && !outRebut(n.id).length);
  roots.sort((a,b) => (IKEYS.indexOf(a.issue)+9)%9 - (IKEYS.indexOf(b.issue)+9)%9 || a.y - b.y);
  roots.forEach(r => { const s = r.side==="con"?"con":"pro"; laneNo[r.id] = CIRC[cnt[s]] || String(cnt[s]+1); cnt[s]++; });
}
const laneTag = n => { const r = rootOf(n), s = r.side==="con"?"con":"pro"; return `<span class="lt ${s}">${sideName(s)} 입론 ${laneNo[r.id]||""}</span>`; };

/* 자동 정렬: 쟁점별 띠, 주장→반박→재반박은 오른쪽으로, 근거 카드는 끝 열 */
function layout(st){
  const g = st || S;
  const find = id => g.nodes.find(n=>n.id===id);
  const kids = id => g.edges.filter(e=>e.kind==="rebut" && e.to===id).map(e=>find(e.from)).filter(Boolean);
  const isRoot = n => n.kind==="claim" && !g.edges.some(e=>e.kind==="rebut" && e.from===n.id);
  const COLW = 290, ROWH = 190, BAND_GAP = 120, X0 = 250, LANE_GAP = 170, TOP = 80;
  const md = (n, seen=new Set()) => { if (seen.has(n.id)) return 0; seen.add(n.id); const k = kids(n.id); return k.length ? 1 + Math.max(...k.map(c=>md(c,seen))) : 0; };
  const roots = g.nodes.filter(isRoot);
  const cols = side => Math.max(3, ...roots.filter(r=>(r.side==="con"?"con":"pro")===side).map(r=>md(r)+1));
  const supTo = id => g.edges.filter(e=>e.kind==="support" && e.from===id).map(e=>find(e.to)).filter(Boolean);
  const rootSide = n => { let cur = n, k = 0; while (k++ < 12){ const t = g.edges.find(e=>e.kind==="rebut" && e.from===cur.id); if (!t) break; cur = find(t.to) || cur; } return cur.side==="con" ? "con" : "pro"; };
  const srcSide = n => { const t = supTo(n.id).find(x=>x.kind==="claim"); return t ? rootSide(t) : null; };
  const hasSrc = side => g.nodes.some(n=>n.kind==="src" && srcSide(n)===side);
  const SRCW = 270, SRCH = 150;
  const laneX = {pro:X0}; laneX.con = X0 + cols("pro")*COLW + (hasSrc("pro") ? SRCW : 0) + LANE_GAP;
  const srcX = {pro: X0 + cols("pro")*COLW + 10, con: laneX.con + cols("con")*COLW + 10};
  let y0 = TOP; const placed = new Set();
  const bands = [...IKEYS.map(k=>({k, roots:roots.filter(n=>n.issue===k)})), {k:null, roots:roots.filter(n=>!IKEYS.includes(n.issue))}];
  for (const b of bands){
    if (b.k===null && !b.roots.length) continue;
    const rows = {pro:0, con:0}; const bandNodes = {pro:[], con:[]}; let srcRows = 0;
    for (const side of ["pro","con"]){
      const place = (n, d) => { if (placed.has(n.id)) return; placed.add(n.id); n.x = laneX[side] + d*COLW; n.y = y0 + rows[side]*ROWH; bandNodes[side].push(n);
        const ks = kids(n.id); if (!ks.length){ rows[side]++; return; } ks.forEach(k => place(k, d+1)); };
      b.roots.filter(r=>(r.side==="con"?"con":"pro")===side).sort((p,q)=>p.y-q.y).forEach(r => place(r, 0));
    }
    for (const side of ["pro","con"]){
      const srcs = g.nodes.filter(n=>n.kind==="src" && !placed.has(n.id) && srcSide(n)===side && supTo(n.id).some(t=>bandNodes[side].includes(t)));
      srcs.forEach((s2,i) => { placed.add(s2.id); s2.x = srcX[side]; s2.y = y0 + i*SRCH; });
      srcRows = Math.max(srcRows, Math.ceil(srcs.length*SRCH/ROWH));
    }
    const nrows = Math.max(rows.pro, rows.con, srcRows, 1);
    if (b.k){ const h = find("h_"+b.k); if (h){ placed.add(h.id); h.x = 0; h.y = y0 + (nrows-1)*ROWH/2; } }
    y0 += nrows*ROWH + BAND_GAP;
  }
  let i = 0; g.nodes.filter(n=>!placed.has(n.id)).forEach(n => { n.x = X0 + (i%4)*COLW; n.y = y0 + Math.floor(i/4)*ROWH; i++; });
}

/* ---------- 보드 렌더 ---------- */
const board = $("#board"), world = $("#world"), nodesEl = $("#nodes"), edgeLayer = $("#edgeLayer");
function applyView(){ const v = S.view; world.style.transform = `translate(${v.x}px,${v.y}px) scale(${v.k})`; board.style.backgroundPosition = `${v.x}px ${v.y}px`; board.style.backgroundSize = `${24*v.k}px ${24*v.k}px`; $("#zv").textContent = Math.round(v.k*100)+"%"; }
function nodeHTML(n){
  if (n.kind==="issue") return `<div class="nd-kind" style="color:inherit;opacity:.7">${ISSUES[n.issue].no}<span class="lock">고정</span></div><div class="nd-t">${esc(n.title)}</div><div class="nd-r">${esc(n.reason)}</div>`;
  if (n.kind==="src") return `<div class="nd-kind">근거 자료 ${n.use==="pro"?"· 찬성용":n.use==="con"?"· 반대용":""}</div><div class="nd-t">${esc(n.title)}</div><div class="nd-r">${esc(n.reason)}</div><div class="nd-meta"><span class="pill">${esc((n.source||"").split("/")[0].trim()).slice(0,34)||"출처 없음"}</span></div><span class="port" data-port title="끌어서 주장에 연결">●</span>`;
  if (n.kind==="memo") return `<div class="nd-kind">메모</div><div class="nd-t">${esc(n.title)}</div>${n.reason?`<div class="nd-r">${esc(n.reason)}</div>`:""}<span class="port" data-port title="끌어서 연결">●</span>`;
  const hasEv = (n.evidence||"").trim() || supports(n.id).length;
  const rb = inRebut(n.id).length;
  const src1 = (n.source||"").split(/[(/]/)[0].trim().slice(0,30);
  return `<div class="nd-kind">${laneTag(n)}${roleName(n)}${n.issue?` · ${ISSUES[n.issue].name}`:""}</div><div class="nd-t">${esc(n.title)}</div>${n.reason?`<div class="nd-r">${esc(n.reason)}</div>`:""}<div class="nd-meta">${hasEv?'<span class="pill ok">근거 있음</span>':'<span class="pill need">근거 필요</span>'}${src1?`<span class="pill">${esc(src1)}</span>`:""}${rb?`<span class="pill">받은 반론 ${rb}</span>`:""}${n.fromSrc?'<span class="pill new">자료에서</span>':""}</div><span class="port" data-port title="끌어서 다른 카드에 연결">●</span>`;
}
function nodeClass(n){ return "nd " + n.kind + (n.side?" "+n.side:"") + (selected?.type==="node" && selected.id===n.id ? " sel":""); }
function renderBoard(){
  computeLaneNo();
  nodesEl.innerHTML = "";
  for (const n of S.nodes){
    const el = document.createElement("div");
    el.className = nodeClass(n); el.dataset.id = n.id; el.tabIndex = 0;
    el.style.left = n.x+"px"; el.style.top = n.y+"px";
    el.innerHTML = nodeHTML(n);
    el.setAttribute("role","button"); el.setAttribute("aria-label", (n.kind==="claim"?roleName(n):n.kind==="src"?"근거 자료":n.kind==="issue"?"쟁점":"메모")+": "+n.title);
    nodesEl.appendChild(el);
  }
  drawEdges();
}
function refreshNode(id){ const n = byId(id), el = nodesEl.querySelector(`[data-id="${id}"]`); if (!n || !el) return; el.className = nodeClass(n); el.innerHTML = nodeHTML(n); }
function refreshAllNodeText(){ computeLaneNo(); S.nodes.forEach(n=>refreshNode(n.id)); drawEdges(); }
function rectOf(id){ const n = byId(id), el = nodesEl.querySelector(`[data-id="${id}"]`); if (!n || !el) return null; return {x:n.x, y:n.y, w:el.offsetWidth, h:el.offsetHeight}; }
function curve(a, b){
  const ac = {x:a.x+a.w/2, y:a.y+a.h/2}, bc = {x:b.x+b.w/2, y:b.y+b.h/2};
  const dx = bc.x-ac.x, dy = bc.y-ac.y; let p1, p2, c1, c2;
  if (Math.abs(dx) >= Math.abs(dy)*0.7){
    const s = dx>0?1:-1; p1 = {x: s>0? a.x+a.w : a.x, y: ac.y}; p2 = {x: s>0? b.x : b.x+b.w, y: bc.y};
    const o = Math.max(40, Math.abs(p2.x-p1.x)/2); c1 = {x:p1.x+s*o, y:p1.y}; c2 = {x:p2.x-s*o, y:p2.y};
  } else {
    const s = dy>0?1:-1; p1 = {x: ac.x, y: s>0? a.y+a.h : a.y}; p2 = {x: bc.x, y: s>0? b.y : b.y+b.h};
    const o = Math.max(40, Math.abs(p2.y-p1.y)/2); c1 = {x:p1.x, y:p1.y+s*o}; c2 = {x:p2.x, y:p2.y-s*o};
  }
  const m = t => { const u=1-t; return {x:u*u*u*p1.x+3*u*u*t*c1.x+3*u*t*t*c2.x+t*t*t*p2.x, y:u*u*u*p1.y+3*u*u*t*c1.y+3*u*t*t*c2.y+t*t*t*p2.y}; };
  return {d:`M${p1.x},${p1.y} C${c1.x},${c1.y} ${c2.x},${c2.y} ${p2.x},${p2.y}`, mid:m(.5)};
}
function edgeStyle(e){
  const f = byId(e.from);
  if (e.kind==="rebut"){ const t = byId(e.to); const lane = (t ? rootOf(t).side : f?.side)==="con" ? "con" : "pro"; const d = f ? depth(f) : 1;
    return {stroke:`var(--${lane})`, marker:`m-${lane}`, dash:"", label: d===1?"반론":d===2?"재반박":"재반론", lc:`var(--${lane})`, w:2.6}; }
  if (e.kind==="support") return {stroke:"var(--src)", marker:"m-sup", dash:"2 4", label:"근거", lc:"var(--src)"};
  return {stroke:"var(--muted)", marker:"m-link", dash:"6 5", label:"", lc:"var(--muted)"};
}
let edgeRAF;
function drawEdges(){ cancelAnimationFrame(edgeRAF); edgeRAF = requestAnimationFrame(drawEdgesNow); }
function drawEdgesNow(){
  let h = "";
  for (const e of S.edges){
    const a = rectOf(e.from), b = rectOf(e.to); if (!a || !b) continue;
    const {d, mid} = curve(a, b), st = edgeStyle(e);
    const sel = selected?.type==="edge" && selected.id===e.id;
    h += `<path class="e" d="${d}" style="stroke:${st.stroke};${st.dash?`stroke-dasharray:${st.dash};`:""}stroke-width:${sel?4.5:(st.w||2)};" marker-end="url(#${st.marker})"/>`;
    if (st.label) h += `<text class="lbl" x="${mid.x}" y="${mid.y+4}" text-anchor="middle" style="fill:${st.lc}">${st.label}</text>`;
    h += `<path class="hit" data-edge="${e.id}" d="${d}"/>`;
  }
  edgeLayer.innerHTML = h;
  drawLanes();
}
function drawLanes(){
  const box = {};
  for (const n of S.nodes){
    let s;
    if (n.kind==="claim") s = rootOf(n).side==="con" ? "con" : "pro";
    else if (n.kind==="src"){ const t = S.edges.filter(e=>e.kind==="support" && e.from===n.id).map(e=>byId(e.to)).find(x=>x && x.kind==="claim"); if (!t) continue; s = rootOf(t).side==="con" ? "con" : "pro"; }
    else continue;
    const r = rectOf(n.id); if (!r) continue;
    const b = box[s] || (box[s] = {x0:Infinity, y0:Infinity, x1:-Infinity, y1:-Infinity});
    b.x0 = Math.min(b.x0, r.x); b.y0 = Math.min(b.y0, r.y); b.x1 = Math.max(b.x1, r.x+r.w); b.y1 = Math.max(b.y1, r.y+r.h);
  }
  const sub = {pro:"찬성 입론 → 반대 반론 → 찬성 재반박", con:"반대 입론 → 찬성 반론 → 반대 재반박"};
  $("#lanes").innerHTML = ["pro","con"].filter(s=>box[s]).map(s => { const b = box[s], P = 28;
    return `<div class="lanebox ${s}" style="left:${b.x0-P}px;top:${b.y0-P-46}px;width:${b.x1-b.x0+P*2}px;height:${b.y1-b.y0+P*2+46}px"><div class="lh"><b>${sideName(s)} 측 입론</b><span>${sub[s]}</span></div></div>`; }).join("");
}

/* ---------- 포인터: 이동 / 카드 끌기 / 연결 ---------- */
const toWorld = (cx, cy) => { const r = board.getBoundingClientRect(), v = S.view; return {x:(cx-r.left-v.x)/v.k, y:(cy-r.top-v.y)/v.k}; };
let drag = null;
board.addEventListener("pointerdown", e => {
  if (e.button !== 0) return;
  const port = e.target.closest("[data-port]");
  const nodeEl = e.target.closest(".nd");
  const hit = e.target.closest("[data-edge]");
  if (port && nodeEl){
    e.preventDefault(); const p = toWorld(e.clientX,e.clientY);
    drag = {type:"link", from:nodeEl.dataset.id, start:p}; board.setPointerCapture(e.pointerId); return;
  }
  if (nodeEl){
    const n = byId(nodeEl.dataset.id); const p = toWorld(e.clientX,e.clientY);
    if (n.kind==="issue"){ select({type:"node", id:n.id}); return; }
    drag = {type:"node", id:n.id, dx:p.x-n.x, dy:p.y-n.y, sx:e.clientX, sy:e.clientY, moved:false, el:nodeEl};
    board.setPointerCapture(e.pointerId); return;
  }
  if (hit){ select({type:"edge", id:hit.dataset.edge}); return; }
  drag = {type:"pan", sx:e.clientX, sy:e.clientY, vx:S.view.x, vy:S.view.y, moved:false};
  board.classList.add("panning"); board.setPointerCapture(e.pointerId);
});
let dropEl = null;
board.addEventListener("pointermove", e => {
  if (!drag) return;
  if (drag.type==="pan"){ const dx=e.clientX-drag.sx, dy=e.clientY-drag.sy; if (Math.abs(dx)+Math.abs(dy)>3) drag.moved=true; S.view.x = drag.vx+dx; S.view.y = drag.vy+dy; applyView(); }
  else if (drag.type==="node"){
    if (!drag.moved && Math.abs(e.clientX-drag.sx)+Math.abs(e.clientY-drag.sy) < 5) return;
    drag.moved = true; const p = toWorld(e.clientX,e.clientY), n = byId(drag.id);
    n.x = Math.round(p.x-drag.dx); n.y = Math.round(p.y-drag.dy);
    drag.el.style.left = n.x+"px"; drag.el.style.top = n.y+"px"; drawEdges(); syncSoon();
  } else if (drag.type==="link"){
    const a = rectOf(drag.from), p = toWorld(e.clientX,e.clientY);
    $("#tempEdge").setAttribute("d", curve(a, {x:p.x, y:p.y, w:1, h:1}).d);
    const t = document.elementFromPoint(e.clientX,e.clientY)?.closest(".nd");
    if (dropEl && dropEl!==t) dropEl.classList.remove("drop");
    dropEl = (t && t.dataset.id!==drag.from) ? t : null; dropEl?.classList.add("drop");
  }
});
function endDrag(e){
  if (!drag) return;
  const d = drag; drag = null; board.classList.remove("panning");
  if (d.type==="pan"){ if (!d.moved) select(null); save(); }
  else if (d.type==="node"){ if (d.moved) save(); else select({type:"node", id:d.id}); }
  else if (d.type==="link"){
    $("#tempEdge").setAttribute("d",""); dropEl?.classList.remove("drop");
    const target = dropEl?.dataset.id; dropEl = null;
    if (target) connect(d.from, target);
  }
}
board.addEventListener("pointerup", endDrag);
board.addEventListener("pointercancel", endDrag);
board.addEventListener("wheel", e => {
  e.preventDefault();
  if (e.ctrlKey || e.metaKey) zoomAt(e.clientX, e.clientY, Math.exp(-e.deltaY*0.01));
  else { S.view.x -= e.deltaX; S.view.y -= e.deltaY; applyView(); save(); }
}, {passive:false});
board.addEventListener("keydown", e => {
  const el = e.target.closest?.(".nd"); if (el && (e.key==="Enter"||e.key===" ")){ e.preventDefault(); select({type:"node", id:el.dataset.id}); }
});
function zoomAt(cx, cy, f){
  const r = board.getBoundingClientRect(), v = S.view;
  const k = Math.min(2.5, Math.max(.2, v.k*f)); const wx = (cx-r.left-v.x)/v.k, wy = (cy-r.top-v.y)/v.k;
  v.k = k; v.x = cx-r.left-wx*k; v.y = cy-r.top-wy*k; applyView(); save();
}
$("#zIn").onclick = () => { const r = board.getBoundingClientRect(); zoomAt(r.left+r.width/2, r.top+r.height/2, 1.2); };
$("#zOut").onclick = () => { const r = board.getBoundingClientRect(); zoomAt(r.left+r.width/2, r.top+r.height/2, 1/1.2); };
function fit(){
  if (!S.nodes.length) return;
  let x0=Infinity,y0=Infinity,x1=-Infinity,y1=-Infinity;
  S.nodes.forEach(n=>{ const r = rectOf(n.id) || {x:n.x,y:n.y,w:240,h:120}; x0=Math.min(x0,r.x); y0=Math.min(y0,r.y); x1=Math.max(x1,r.x+r.w); y1=Math.max(y1,r.y+r.h); });
  const b = board.getBoundingClientRect(), pad = 60;
  const k = Math.min(1.1, Math.max(.25, Math.min((b.width-pad*2)/(x1-x0), (b.height-pad*2-60)/(y1-y0))));
  S.view = {k, x: (b.width-(x1-x0)*k)/2 - x0*k, y: pad+40 - y0*k}; applyView(); save();
}
$("#zFit").onclick = fit;
let layoutArmed = 0;
$("#layoutBtn").onclick = (e) => {
  const prev = S.nodes.map(n=>({id:n.id,x:n.x,y:n.y}));
  layout(); renderBoard(); requestAnimationFrame(fit); save();
  toast("쟁점별로 다시 정렬했습니다.", "되돌리기", () => { prev.forEach(p=>{ const n=byId(p.id); if(n){n.x=p.x;n.y=p.y;} }); renderBoard(); save(); });
};
function focusNode(id){
  const n = byId(id); if (!n) return;
  if (mode==="sum") setMode("split");
  requestAnimationFrame(()=>{
    const r = rectOf(id), b = board.getBoundingClientRect(), v = S.view;
    if (v.k < .7) v.k = .85;
    v.x = b.width/2 - (r.x + r.w/2)*v.k; v.y = b.height/2 - (r.y + r.h/2)*v.k; applyView(); save();
    select({type:"node", id});
    const el = nodesEl.querySelector(`[data-id="${id}"]`); el?.classList.remove("flash"); void el?.offsetWidth; el?.classList.add("flash");
  });

/* ---------- 연결 ---------- */
function connect(from, to){
  const a = byId(from), b = byId(to);
  if (!a || !b || from===to) return;
  if (S.edges.some(e=>e.from===from && e.to===to)) { toast("이미 연결되어 있습니다."); return; }
  let kind = "link";
  if (a.kind==="src" && b.kind!=="src") kind = "support";
  else if (b.kind==="src" && a.kind!=="src") { const e = {id:nid("e"), from:to, to:from, kind:"support"}; S.edges.push(e); afterConnect(e); return; }
  else if (a.kind==="claim" && b.kind==="claim" && a.side!==b.side) kind = "rebut";
  else if (b.kind==="issue" && a.kind==="claim"){ a.issue = b.issue; const e = {id:nid("e"), from:to, to:from, kind:"link"}; S.edges.push(e); afterConnect(e); return; }
  else if (a.kind==="issue" && b.kind==="claim"){ b.issue = a.issue; }
  const e = {id:nid("e"), from, to, kind};
  if (kind==="rebut" && !b.issue && a.issue) b.issue = a.issue;
  if (kind==="rebut" && !a.issue && b.issue) a.issue = b.issue;
  S.edges.push(e); afterConnect(e);
}
function afterConnect(e){
  save(); refreshAllNodeText(); select({type:"edge", id:e.id});
  const lbl = {rebut:"반박", support:"근거", link:"연결"}[e.kind];
  toast(`‘${lbl}’ 선으로 이었습니다. 오른쪽에서 종류를 바꿀 수 있어요.`);
  queueSum();
}

    x: Math.round(c.x - 118 + (opts.jitter? (Math.random()*60-30):0)), y: Math.round(c.y - 50 + (opts.jitter?(Math.random()*60-30):0)), fromSrc: opts.fromSrc};

}

  return S.nodes.filter(n=>n.kind==="claim").map(n=>`[${n.issue||"-"}/${roleName(n)}] ${n.title}`).join("\n").slice(0, 8000);
}
const normSide = s => /con|반대/.test(String(s)) ? "con" : "pro";
const normIssue = s => { s = String(s); return /sol|해결/.test(s) ? "solution" : /cost|이익|비용/.test(s) ? "cost" : "problem"; };
let orgCtl;
async function organize(){

  $("#organize").disabled = true; $("#stopOrg").hidden = false;
  st.textContent = "자료를 읽고 쟁점별로 나누는 중입니다… (30초 안팎)";

논제: "${S.topic}" (정책 논제)
필수 쟁점: problem(문제가 중대·시급한가), solution(AI가 대신하면 해결되고 실행 가능한가), cost(이익이 비용·부작용보다 큰가).

[자료 제목/출처] ${title || "(없음)"}
[자료]
${text.slice(0, 20000)}

JSON 하나만:

    const items = (Array.isArray(r?.items) ? r.items : []).filter(it=>it && it.title);
    // 새 묶음을 기존 카드 아래쪽에 배치
    const maxY = Math.max(0, ...S.nodes.map(n=>n.y)) + 260; let row = 0;
    const srcNode = addNode("src", {at:{x:118, y:maxY+50}, title: title || "붙여 넣은 자료", reason: String(r?.source_summary||text.slice(0,140)), source: title, use:"both", fromSrc:true});
    const made = [];
    items.forEach(it => {
      const side = normSide(it.side), issue = normIssue(it.issue), y = maxY + row*150;
      const mk = (o, s, col) => addNode(s, {at:{x:240+col*290+118, y:y+50}, issue, title:String(o.title||""), reason:String(o.reason||""), evidence:String(o.evidence||""), source: o.evidence ? (title||"붙여 넣은 자료") : "", fromSrc:true});
      const root = mk(it, side, 1); made.push(root.id);
      if (it.evidence) S.edges.push({id:nid("e"), from:srcNode.id, to:root.id, kind:"support"});
      if (it.rebuttal?.title){ const rb = mk(it.rebuttal, other(side), 2); S.edges.push({id:nid("e"), from:rb.id, to:root.id, kind:"rebut"});

    c.querySelector("[data-polish]").onclick = async () => {
      const sample = await samplePromise;
      if (!sample){ st.className="status err"; st.textContent = "이 환경에서는 다듬기를 쓸 수 없습니다."; return; }
      st.className = "status"; st.textContent = "다듬는 중입니다…";
      try{
        const r = await sample(`다음은 고등학생 CEDA 토론의 ${sp.title}(${sp.sec/60}분) 초안이다. 발표용 말하기체로 자연스럽게 다듬어라.
- 내용·수치·출처는 바꾸거나 새로 지어내지 마라. 연결어와 문장만 다듬는다.
- 공백 제외 ${sp.sec/60*290}자 이내. 다듬은 본문만 답하라.

${ta.value}`, {cache:false, onText:({text})=>{ ta.value = text; meter(); }});
        ta.value = r.text.trim(); S.speeches[sp.key] = ta.value; save(); meter(); st.textContent = "다듬었습니다. 수치와 출처가 그대로인지 확인하세요.";
      }catch(e){ st.className = "status err"; st.textContent = errCopy(e?.code); }
    };
  });
}
async function genCx(){
  const st = $("#cxStatus"); st.className = "status";
  const sample = await samplePromise;
  if (!sample){ st.className = "status err"; st.textContent = "이 환경에서는 자동 생성을 쓸 수 없습니다. 직접 추가해 주세요."; return; }
  const opp = S.nodes.filter(n=>n.kind==="claim" && n.side!==ourSide && !outRebut(n.id).length).map(n=>`- ${n.title}${n.reason?" / 이유: "+n.reason:""}${evText(n).length?" / 근거: "+evText(n).join(" "):""}${srcText(n).length?" / 출처: "+srcText(n).join(", "):""}`);
  st.textContent = "상대 주장을 보고 질문을 만드는 중입니다…";
  try{
    const arr = await sample.json(`CEDA 토론 논제: "${S.topic}". 우리는 ${sideName(ourSide)} 측이다.
상대(${sideName(other(ourSide))}) 측이 입론에서 말할 주장과 근거:
${opp.join("\n").slice(0,8000)}

반대 신문 질문 3쌍을 만들어라. 확인 질문은 상대 발언을 그대로 확인하는 "~맞습니까?" 형식, 검증 질문은 근거의 신뢰성·타당성·공정성 허점을 찌르는 폐쇄형 질문.
- 상대가 말한 범위 안에서만. 개방형 질문 금지. 수치·연구를 새로 지어내지 마라.
JSON만: [{"confirm":"","verify":""}]`, {cache:false});
    const list = (Array.isArray(arr)?arr:[]).filter(o=>o?.confirm).slice(0,4);
    list.forEach(o => S.cx.push({side:ourSide, confirm:String(o.confirm), verify:String(o.verify||"")}));
    save(); renderSum(); const s2 = $("#cxStatus"); if (s2) s2.textContent = `질문 ${list.length}쌍을 추가했습니다.`;
  }catch(e){ const s2 = $("#cxStatus"); if (s2){ s2.className="status err"; s2.textContent = errCopy(e?.code); } }
}
function exportAll(){
  let t = `논제: ${S.topic}\n\n1. 주요 용어 정의\n` + S.terms.map(x=>`- ${x.term}: ${x.def}`).join("\n") + `\n\n문제 상황이 발생한 배경\n` + S.background.map(b=>"- "+b).join("\n") + "\n\n2·3. 필수 쟁점과 근거 배치\n";
  IKEYS.forEach(k => { t += `\n[${ISSUES[k].name}]\n`; ["pro","con"].forEach(s => roots(k,s).forEach(n => {
    t += `(${sideName(s)}) 주장: ${n.title}\n   이유: ${n.reason}\n   근거: ${evText(n).join(" / ")}\n   출처: ${srcText(n).join(" / ")}\n`;
    inRebut(n.id).forEach(r => { t += `      ↳ (${sideName(r.side)} 반박) ${r.title}\n`; inRebut(r.id).forEach(rr => t += `         ↳ (${sideName(rr.side)} 재반박) ${rr.title}\n`); });
  })); });
  t += "\n4. 입론서\n" + SPEECHES.map(sp => `\n[${sp.title}]\n${S.speeches[sp.key] ?? draft(sp)}`).join("\n");
  t += "\n\n6. 반대 신문\n" + S.cx.map(q=>`(${sideName(q.side)} 측) 확인: ${q.confirm}\n   검증: ${q.verify}`).join("\n");
  return t;
}

/* ---------- 공통 ---------- */
let toastT;
function toast(msg, action, fn){
  const t = $("#toast"); t.innerHTML = `<span>${esc(msg)}</span>${action?`<button>${esc(action)}</button>`:""}`; t.hidden = false;
  if (action) t.querySelector("button").onclick = () => { fn(); t.hidden = true; };
  clearTimeout(toastT); toastT = setTimeout(()=>t.hidden = true, action ? 6000 : 3000);
}
async function copyText(text, el){
  try { await navigator.clipboard.writeText(text); toast("복사했습니다. 활동지나 한글 문서에 붙여 넣으세요."); }
  catch(e){ if (el){ el.focus(); el.select(); toast("선택해 두었습니다. Ctrl+C로 복사하세요."); } else toast("복사하지 못했습니다. 브라우저가 클립보드를 막았어요."); }
}
function setMode(m){
  mode = m;
  document.querySelectorAll("[data-mode]").forEach(b => b.setAttribute("aria-pressed", b.dataset.mode===m));
  $("#main").classList.toggle("split", m==="split");
  $("#boardWrap").hidden = m==="sum"; $("#sumWrap").hidden = m==="board"; $("#splitter").hidden = m!=="split";
  if (m!=="board") renderSum();
  if (m!=="sum") requestAnimationFrame(()=>{ applyView(); drawEdges(); });
  try{ localStorage.setItem(KEY+"-mode", m); }catch(e){}
}
document.querySelectorAll("[data-mode]").forEach(b => b.onclick = () => setMode(b.dataset.mode));
window.addEventListener("resize", () => drawEdges());


/* ---------- 단독 웹페이지: 파일 저장/불러오기 ---------- */
if (!(window.claude && window.claude.use)) document.documentElement.classList.add("noai");
$("#saveFile").onclick = () => {
  const blob = new Blob([JSON.stringify(S, null, 1)], {type:"application/json"});
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob);
  const d = new Date(); a.download = `토론보드_${d.getMonth()+1}월${d.getDate()}일.json`;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
  toast("보드를 파일로 저장했습니다. 모둠원에게 보내 ‘파일 불러오기’로 열 수 있어요.");
};
$("#loadFile").onchange = async (e) => {
  const f = e.target.files[0]; if (!f) return;
  try { const d = JSON.parse(await f.text()); if (!Array.isArray(d.nodes) || !Array.isArray(d.edges)) throw 0;
    const prev = S; S = d; selected = null; save(); renderBoard(); renderPanel(); if (mode!=="board") renderSum(); requestAnimationFrame(fit);
    toast(FB ? "파일을 불러왔습니다. 같은 방의 모두에게 반영됩니다." : "파일을 불러왔습니다.", "되돌리기", () => { S = prev; save(); renderBoard(); if (mode!=="board") renderSum(); });
  } catch(err){ toast("보드 파일이 아닙니다. ‘파일로 저장’으로 만든 .json 파일을 골라 주세요."); }
  e.target.value = "";
};

/* ---------- Firebase 실시간 공유 ---------- */
$("#roomName").textContent = "방: " + ROOM;
$("#copyLink").onclick = () => copyText(location.href.split("#")[0] + "#" + encodeURIComponent(ROOM));
const arr = x => Array.isArray(x) ? x.filter(Boolean) : Object.values(x || {});
function applyRemote(v){
  const keepId = drag?.type==="node" ? drag.id : null;
  const editingId = (panel.contains(document.activeElement) && selected?.type==="node") ? selected.id : null;
  const remoteNodes = Object.values(v.nodes || {});
  S.nodes = remoteNodes.map(n => ((n.id===keepId || n.id===editingId) && byId(n.id)) ? byId(n.id) : n);
  S.edges = Object.values(v.edges || {});
  const m = v.meta || {};
  if (m.topic) S.topic = m.topic;
  const sumEditing = sheet.contains(document.activeElement);
  if (!sumEditing){ S.terms = arr(m.terms); S.background = arr(m.background); S.cx = arr(v.cx); S.speeches = v.speeches || {}; }
  last = {meta:{topic:m.topic, terms:arr(m.terms), background:arr(m.background)}, nodes:v.nodes||{}, edges:v.edges||{}, cx:arr(v.cx), speeches:v.speeches||{}};
  last = clean(last);
  renderBoard();
  if (drag?.type==="node") drag.el = nodesEl.querySelector(`[data-id="${drag.id}"]`) || drag.el;
  if (!panel.contains(document.activeElement)) renderPanel();
  if (mode !== "board") queueSum();
  try{ localStorage.setItem(LKEY, JSON.stringify(S)); }catch(e){}
  syncSoon(); // 보내지 못한 내 수정이 있으면 이어서 보냄
}
let argTried = false, evTried = false;
function startSync(){
  const st = $("#syncState");
  const cfg = window.FIREBASE_CONFIG;
  if (!cfg || !window.firebase){ st.textContent = "혼자 쓰는 중 (공유 설정 전)"; st.className = "pill off"; $("#copyLink").hidden = true;
    if (ROOM==="main" && (!S.argset1 || !S.argset2)) setTimeout(() => afterArgSet((S.argset1 ? 0 : insertArgSet()) + insertEvidenceSet()), 0); return; }
  try{
    const app = firebase.apps.length ? firebase.app() : firebase.initializeApp(cfg);
    const db = app.database(); const ref = db.ref("boards/" + ROOM);
    FB = {db, ref};
    st.textContent = "연결 중…"; st.className = "pill";
    let online = 0;
    db.ref(".info/connected").on("value", s => {
      if (s.val() === true){ const me = db.ref("presence/" + ROOM).push(); me.onDisconnect().remove(); me.set(Date.now()); }
      st.textContent = s.val() ? `실시간 공유 중 · ${online||1}명 접속` : "연결 끊김 · 다시 연결하는 중"; st.className = "pill " + (s.val() ? "live" : "off");
    });
    db.ref("presence/" + ROOM).on("value", s => { online = s.numChildren(); if (st.classList.contains("live")) st.textContent = `실시간 공유 중 · ${online}명 접속`; });
    ref.on("value", snap => {
      const v = snap.val();
      if (!v || !v.nodes){
        ref.child("meta/seededAt").transaction(cur => cur ? undefined : Date.now(), (err, committed) => {
          if (committed){ last = {meta:{}, nodes:{}, edges:{}, cx:[], speeches:{}}; pushDiff(); }
        });
        return;
      }
      applyRemote(v);
      if (ROOM==="main" && !(v.meta && v.meta.argset1) && !argTried){
        argTried = true;
        ref.child("meta/argset1").transaction(cur => cur ? undefined : Date.now(), (err, committed) => { if (committed) afterArgSet(insertArgSet() + insertEvidenceSet()); });
      } else if (ROOM==="main" && v.meta && v.meta.argset1 && !v.meta.argset2 && !evTried){
        evTried = true;
        ref.child("meta/argset2").transaction(cur => cur ? undefined : Date.now(), (err, committed) => { if (committed) afterArgSet(insertEvidenceSet()); });
      }
    }, err => { st.textContent = "공유 저장소에 접근할 수 없음 (규칙 확인)"; st.className = "pill off"; FB = null; });
  }catch(e){ st.textContent = "공유 설정 오류"; st.className = "pill off"; FB = null; }
}

/* ---------- 창 크기 조절 ---------- */
const mainEl = $("#main"), splitter = $("#splitter");
let sp = 56; try { sp = +localStorage.getItem(KEY+"-sp") || 56; } catch(e){}
const setSp = v => { sp = Math.min(82, Math.max(18, v)); mainEl.style.setProperty("--sp", sp); drawEdges(); try{ localStorage.setItem(KEY+"-sp", sp); }catch(e){} };
setSp(sp);
const narrow = () => window.matchMedia("(max-width:860px)").matches;
splitter.addEventListener("pointerdown", e => { e.preventDefault(); splitter.setPointerCapture(e.pointerId); splitter.classList.add("drag"); });
splitter.addEventListener("pointermove", e => {
  if (!splitter.classList.contains("drag")) return;
  const r = mainEl.getBoundingClientRect();
  setSp(narrow() ? (e.clientY - r.top) / r.height * 100 : (e.clientX - r.left) / r.width * 100);
});
const endSplit = () => splitter.classList.remove("drag");
splitter.addEventListener("pointerup", endSplit); splitter.addEventListener("pointercancel", endSplit);
splitter.addEventListener("dblclick", () => setSp(56));
splitter.addEventListener("keydown", e => {
  const k = e.key; if (["ArrowLeft","ArrowUp"].includes(k)){ e.preventDefault(); setSp(sp-4); } if (["ArrowRight","ArrowDown"].includes(k)){ e.preventDefault(); setSp(sp+4); }
});

/* ---------- 정리 창 글자 크기 ---------- */
var sheetZoom = 1; try { sheetZoom = +localStorage.getItem(KEY+"-sz") || 1; } catch(e){}
function setSheetZoom(z){ sheetZoom = Math.round(Math.min(2, Math.max(.6, z))*100)/100; sheet.style.zoom = sheetZoom; const v = $("#szV"); if (v) v.textContent = Math.round(sheetZoom*100)+"%"; try{ localStorage.setItem(KEY+"-sz", sheetZoom); }catch(e){} }
setSheetZoom(sheetZoom);

/* ---------- 두 손가락: 벌리고 오므려 확대·축소, 함께 끌어 이동 ---------- */
function twoFinger(el, onStart, onMove){
  const pts = new Map(); let g = null, block = false;
  const dist = () => { const [a, b] = [...pts.values()]; return Math.hypot(a.x-b.x, a.y-b.y) || 1; };
  const mid = () => { const [a, b] = [...pts.values()]; return {x:(a.x+b.x)/2, y:(a.y+b.y)/2}; };
  el.addEventListener("pointerdown", e => {
    if (e.pointerType !== "touch") return;
    pts.set(e.pointerId, {x:e.clientX, y:e.clientY});
    if (pts.size === 2){ e.stopImmediatePropagation(); e.preventDefault(); try{ el.setPointerCapture(e.pointerId); }catch(_){} g = {d:dist(), m:mid(), ...onStart()}; block = true; }
  }, true);
  el.addEventListener("pointermove", e => {
    if (!pts.has(e.pointerId)) return;
    pts.set(e.pointerId, {x:e.clientX, y:e.clientY});
    if (g && pts.size >= 2){ e.stopImmediatePropagation(); e.preventDefault(); onMove(g, dist()/g.d, mid()); }
    else if (block) e.stopImmediatePropagation();
  }, true);
  const up = e => {
    if (!pts.has(e.pointerId)) return;
    pts.delete(e.pointerId);
    if (pts.size < 2) g = null;
    if (block){ e.stopImmediatePropagation(); if (!pts.size) block = false; }
  };
  el.addEventListener("pointerup", up, true); el.addEventListener("pointercancel", up, true);
}
// 보드: 두 손가락 사이 지점을 기준으로 확대·축소하면서 함께 이동
twoFinger(board, () => {
  if (drag){ if (drag.type==="node"){ const n = byId(drag.id); if (n && drag.moved) save(); } $("#tempEdge").setAttribute("d",""); dropEl?.classList.remove("drop"); dropEl = null; drag = null; board.classList.remove("panning"); }
  return {v:{...S.view}};
}, (g, ratio, m) => {
  const r = board.getBoundingClientRect(), v0 = g.v;
  const k = Math.min(2.5, Math.max(.2, v0.k * ratio));
  const wx = (g.m.x - r.left - v0.x) / v0.k, wy = (g.m.y - r.top - v0.y) / v0.k;
  S.view = {k, x: m.x - r.left - wx*k, y: m.y - r.top - wy*k}; applyView(); save();
});
// 정리 창: 두 손가락으로 글자 크기 조절 (한 손가락은 그대로 스크롤)
const sumWrapEl = $("#sumWrap");
twoFinger(sumWrapEl, () => ({z:sheetZoom, sy:sumWrapEl.scrollTop}), (g, ratio) => { setSheetZoom(g.z * ratio); });
sumWrapEl.addEventListener("wheel", e => { if (!(e.ctrlKey || e.metaKey)) return; e.preventDefault(); setSheetZoom(sheetZoom * Math.exp(-e.deltaY*0.01)); }, {passive:false});

window.addEventListener("hashchange", () => location.reload());
startSync();

applyView(); renderBoard();
let m0 = "board"; try{ m0 = localStorage.getItem(KEY+"-mode") || "board"; }catch(e){}
setMode(m0);
let firstVisit = true; try{ firstVisit = !localStorage.getItem(LKEY); }catch(e){}
if (firstVisit) requestAnimationFrame(fit);
save();
})();
